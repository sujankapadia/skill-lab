[project]
name = "skill-lab"
version = "0.1.0"
description = "Run an agent skill many times via Harbor and analyze behavioral variation across runs."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
skill-lab = "skill_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
