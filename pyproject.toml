[project]
name = "skill-lab"
version = "0.0.1"
description = "Run an agent skill many times via Harbor and analyze behavioral variation across runs."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
skill-lab-spike = "skill_lab.spike:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_lab"]
